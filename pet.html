<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Марк-0</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default}
:root{--c:#3ff0ff;--c2:#bffcff;--eye:#e9fdff;--amber:#ffb347;--red:#c8162a;--gold:#f2b632}
body.alert{--eye:#ffd27a}
*{box-sizing:border-box}
#stage{position:absolute;left:0;top:0;width:660px;height:660px}

/* ── робот ── */
#rig{position:absolute;left:298px;top:290px;width:64px;height:80px;transform-origin:32px 40px;transition:transform .35s cubic-bezier(.3,.7,.4,1)}
.o-wallL #rig{transform:rotate(90deg)} .o-wallR #rig{transform:rotate(-90deg)} .o-ceil #rig{transform:rotate(180deg)}
#swing{position:absolute;inset:0;transform-origin:32px 0;transition:transform .12s}
#face{position:absolute;inset:0;transition:transform .25s}
.f-l #face{transform:scaleX(-1)}
#trick{position:absolute;inset:0;transform-origin:32px 45px}
#bot{position:absolute;inset:0;cursor:grab}
#bot:active{cursor:grabbing}
#bot svg{width:64px;height:80px;overflow:visible}
#m0{transform-origin:32px 60px}
.limb{transform-box:view-box;transition:transform .3s}
#legL{transform-origin:26px 56px} #legR{transform-origin:38px 56px}
#armL{transform-origin:16px 34px} #armR{transform-origin:48px 34px}
#head{transform-box:view-box;transform-origin:32px 30px;transition:transform .3s}
.eye{fill:var(--eye);filter:url(#glow);transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.eye.r{animation-delay:.05s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.happyeyes{opacity:0;fill:none;stroke:var(--eye);stroke-width:1.6;stroke-linecap:round;filter:url(#glow)}
.blush{opacity:0;fill:#ff7aa8;transition:opacity .3s}
#reactorCore{fill:var(--c2);filter:url(#glow);animation:pulse 2.4s ease-in-out infinite}
#reactorRing{transform-box:view-box;transform-origin:32px 42px;animation:spin 3s linear infinite}
@keyframes pulse{50%{opacity:.55}} @keyframes spin{to{transform:rotate(360deg)}}
.flame{fill:url(#flameG);transform-box:fill-box;transform-origin:top center;opacity:0;transition:opacity .2s}
.pflame{fill:url(#flameG);transform-box:fill-box;transform-origin:top center;opacity:0}
.ear{fill:var(--c);opacity:.35}
.mouth{fill:var(--c);opacity:0;transform-box:fill-box;transform-origin:center}
.mag .boot{filter:drop-shadow(0 0 3px #3ff0ff)}

/* idle */
.a-idle #m0{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6px)}}
.a-idle #armL{animation:swayL 3s ease-in-out infinite} .a-idle #armR{animation:swayR 3s ease-in-out infinite}
@keyframes swayL{50%{transform:rotate(4deg)}} @keyframes swayR{50%{transform:rotate(-4deg)}}
.look #head{transform:rotate(-12deg) translateX(-1px)}
.look2 #head{transform:rotate(10deg)}

/* ходьба (и по стенам, и по потолку — магнитные ботинки) */
.a-walk #legL{animation:stepA .52s ease-in-out infinite} .a-walk #legR{animation:stepB .52s ease-in-out infinite}
.a-walk #armL{animation:stepB .52s ease-in-out infinite} .a-walk #armR{animation:stepA .52s ease-in-out infinite}
.a-walk #m0{animation:wbob .26s ease-in-out infinite}
@keyframes stepA{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}}
@keyframes stepB{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
@keyframes wbob{50%{transform:translateY(-1.8px)}}
.a-walk #head{transform:rotate(4deg)}

/* полёт */
.a-fly #legL{transform:rotate(6deg)} .a-fly #legR{transform:rotate(-6deg)}
.a-fly #armL{transform:rotate(22deg)} .a-fly #armR{transform:rotate(-22deg)}
.a-fly .flame,.a-chase .flame,.a-fall.thr .flame{opacity:1;animation:flick .07s infinite alternate}
.a-fly .pflame,.a-chase .pflame{opacity:.9;animation:flick .06s infinite alternate}
.a-fly #m0,.a-chase #m0{animation:fbob .9s ease-in-out infinite}
@keyframes flick{to{transform:scaleY(.72) scaleX(.9)}}
@keyframes fbob{50%{transform:translateY(-2.5px)}}
.a-chase #legL{transform:rotate(10deg)} .a-chase #legR{transform:rotate(-4deg)}
.a-chase #armR{animation:wave .5s ease-in-out infinite}

/* падение, перенос */
.a-fall #armL{animation:flail .22s ease-in-out infinite} .a-fall #armR{animation:flail .22s ease-in-out infinite reverse}
.a-fall #legL{animation:stepA .25s infinite} .a-fall #legR{animation:stepB .25s infinite}
@keyframes flail{0%,100%{transform:rotate(150deg)}50%{transform:rotate(120deg)}}
.a-fall .eye,.a-drag .eye{transform:scale(1.25)!important;animation:none}
.a-drag #armL{transform:rotate(155deg)} .a-drag #armR{transform:rotate(-155deg)}
.a-drag #legL{animation:dang 1s ease-in-out infinite} .a-drag #legR{animation:dang 1s ease-in-out infinite -.5s}
@keyframes dang{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}

/* сидит на окне: ноги свисают */
.a-sit #m0,.a-sleep #m0{transform:translateY(20px)}
.a-sit #legL{animation:dangle 2.4s ease-in-out infinite} .a-sit #legR{animation:dangle 2.4s ease-in-out infinite -1.2s}
@keyframes dangle{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(6deg)}}
.a-sit #armL{transform:rotate(30deg)} .a-sit #armR{transform:rotate(-30deg)}

/* сон */
.a-sleep .eye{transform:scaleY(.1)!important;animation:none}
.a-sleep #head{transform:rotate(14deg) translateY(1px)}
.a-sleep #reactorCore{opacity:.3;animation:none}
.a-sleep #armL{transform:rotate(22deg)} .a-sleep #armR{transform:rotate(-22deg)}
.a-sleep #legL{transform:rotate(-10deg)} .a-sleep #legR{transform:rotate(4deg)}
#zzz{position:absolute;left:350px;top:276px;width:40px;height:30px;pointer-events:none}
.z{position:absolute;font:700 13px 'Orbitron',monospace;color:var(--c);opacity:0;text-shadow:0 0 8px var(--c)}
.a-sleep .z{animation:zz 3s ease-in infinite}
.z:nth-child(2){animation-delay:1s!important;font-size:10px}.z:nth-child(3){animation-delay:2s!important;font-size:8px}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(16px,-36px)}}

/* головокружение */
.a-dizzy #m0{animation:wob .5s ease-in-out infinite}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#stars{position:absolute;left:302px;top:276px;width:56px;height:20px;pointer-events:none;opacity:0}
.a-dizzy #stars{opacity:1}
#stars span{position:absolute;left:24px;top:2px;color:#ffd166;font-size:11px;text-shadow:0 0 6px #ffd166;animation:orbit 1s linear infinite}
#stars span:nth-child(2){animation-delay:-.33s}#stars span:nth-child(3){animation-delay:-.66s}
@keyframes orbit{0%{transform:translate(-20px,0) scale(.7)}25%{transform:translate(0,4px) scale(1)}50%{transform:translate(20px,0) scale(.7)}75%{transform:translate(0,-3px) scale(.5)}100%{transform:translate(-20px,0) scale(.7)}}

/* выглядывает */
.a-peek #head{transform:rotate(-18deg)}
.a-peek #armR{transform:rotate(-120deg)}

/* реакции */
.talk .mouth{opacity:.95;animation:eq .22s ease-in-out infinite alternate}
.talk .mouth:nth-child(2){animation-delay:.07s}.talk .mouth:nth-child(3){animation-delay:.14s}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1.2)}}
.stroke .eye{opacity:0} .stroke .happyeyes{opacity:1} .stroke .blush{opacity:.75}
.stroke #m0{animation:purr .07s linear infinite!important}
@keyframes purr{50%{transform:translate(.5px,-.3px)}}
.stroke #head{transform:rotate(-8deg)}
.happy #trick{animation:hop .55s ease-out}
@keyframes hop{30%{transform:translateY(-14px) rotate(-5deg)}60%{transform:translateY(-3px) rotate(4deg)}}
.sad #head{transform:translateY(2px) rotate(6deg)} .sad .eye{transform:scaleY(.55) translateY(1px)!important}
.sad #armL{transform:rotate(6deg)} .sad #armR{transform:rotate(-6deg)}
.confused #head{transform:rotate(-16deg)}
#q{position:absolute;left:346px;top:272px;font:700 18px 'Orbitron',monospace;color:#ffd166;opacity:0;text-shadow:0 0 8px #ffd166;pointer-events:none;transition:opacity .3s}
.confused #q{opacity:1;animation:qbob .6s ease-in-out infinite alternate}
@keyframes qbob{to{transform:translateY(-4px)}}
.listen .ear{opacity:1;animation:pulse .3s infinite} .listen .eye{transform:scale(1.2)!important}
.listen #head{transform:translateY(-1px)}
.wave #armR{animation:wave .45s ease-in-out 5!important}
@keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-115deg)}}
/* сканер */
#beam{opacity:0;transform-box:view-box;transform-origin:32px 22px;fill:url(#beamG)}
.scan #beam{opacity:1;animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.scan .eye{fill:#fff}

/* трюки */
.t-flip #trick{animation:tflip 1.1s cubic-bezier(.3,.7,.4,1)}
@keyframes tflip{0%{transform:none}30%{transform:translateY(-60px)}70%{transform:translateY(-60px) rotate(360deg)}100%{transform:rotate(360deg)}}
.t-flip .flame,.t-salute .flame{opacity:1;animation:flick .05s infinite alternate}
.t-salute #trick{animation:tsal 1.4s ease-in-out} .t-salute #armR{transform:rotate(-140deg)!important}
@keyframes tsal{0%,100%{transform:none}25%,75%{transform:translateY(-34px)}50%{transform:translateY(-38px) scale(1.06)}}
.t-dance #trick{animation:tdance .5s ease-in-out 6}
.t-dance #armL{animation:flail .25s infinite!important} .t-dance #armR{animation:flail .25s infinite reverse!important}
@keyframes tdance{0%,100%{transform:none}25%{transform:translateX(-9px) rotate(-12deg)}50%{transform:translateY(-8px)}75%{transform:translateX(9px) rotate(12deg)}}
.t-spin #trick{animation:tspin 1s ease-in-out}
@keyframes tspin{to{transform:rotateY(720deg)}}

/* частицы: сердечки, искры */
.fx{position:absolute;pointer-events:none;font-size:12px;animation:rise 1.4s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),-42px) scale(1.15)}}

/* ── пузырь ── */
#bubble{position:absolute;left:0;top:0;opacity:0;transform:scale(.92);transform-origin:center;max-width:230px;width:max-content;
  padding:8px 11px 9px;border:1px solid var(--c);background:rgba(3,14,22,.93);color:#dff8ff;
  font:500 12.5px/1.4 'Exo 2',-apple-system,sans-serif;
  box-shadow:0 0 18px rgba(63,240,255,.35),inset 0 0 14px rgba(63,240,255,.08);
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  transition:opacity .3s,transform .3s;pointer-events:none}
#bubble.show{opacity:1;transform:scale(1)}
#bubble b{display:block;font:700 8.5px/1 'Orbitron',monospace;letter-spacing:.24em;color:var(--c);margin-bottom:5px}
#bubble.alert{border-color:var(--amber);box-shadow:0 0 18px rgba(255,179,71,.4)} #bubble.alert b{color:var(--amber)}

/* ── облако функций ── */
#menu{position:absolute;left:0;top:0;width:344px;height:276px;opacity:0;transform:scale(.6) translateY(20px);pointer-events:none;
  transition:opacity .28s,transform .38s cubic-bezier(.2,1.4,.4,1)}
#menu.show{opacity:1;transform:none;pointer-events:auto}
#menu svg.cloud{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#menu .cpath{fill:rgba(3,16,26,.94);stroke:var(--c);stroke-width:1.4;filter:drop-shadow(0 0 10px rgba(63,240,255,.55))}
#menu .hdr{position:absolute;left:0;right:0;top:30px;text-align:center;font:700 9px 'Orbitron',monospace;letter-spacing:.3em;color:var(--c)}
#menu .items{position:absolute;left:40px;right:40px;top:52px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
#menu button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:0;color:#cfefff;
  font:600 8.5px/1.1 'Exo 2',sans-serif;letter-spacing:.02em;opacity:0;transform:translateY(8px) scale(.8);transition:transform .2s}
#menu.show button{animation:pop .35s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
#menu button i{width:38px;height:38px;border-radius:50%;border:1px solid rgba(63,240,255,.45);background:radial-gradient(circle at 50% 35%,rgba(63,240,255,.18),rgba(63,240,255,.03));
  display:flex;align-items:center;justify-content:center;transition:.15s}
#menu button i svg{width:17px;height:17px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#menu button:hover i{border-color:var(--c);box-shadow:0 0 14px rgba(63,240,255,.6);background:rgba(63,240,255,.22);transform:scale(1.08)}
#menu button.red i{border-color:rgba(255,61,90,.6);background:radial-gradient(circle at 50% 35%,rgba(255,61,90,.25),rgba(255,61,90,.04))}
#menu button.red i svg{stroke:#ff5a72}
#menu button.red:hover i{box-shadow:0 0 16px rgba(255,61,90,.8)}
#menu .mk{position:absolute;left:50px;right:50px;bottom:27px;display:flex;justify-content:center;gap:5px}
#menu .mk button{flex-direction:row;font:600 8.5px 'JetBrains Mono',monospace;border:1px solid rgba(63,240,255,.3);padding:3px 6px;letter-spacing:.06em;color:#a6fbff}
#menu .mk button:hover{border-color:var(--c);background:rgba(63,240,255,.12)}
#menu .tail{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(3,16,26,.94);border:1px solid var(--c);box-shadow:0 0 8px rgba(63,240,255,.5)}
</style>
</head>
<body class="o-floor a-idle f-r">
<div id="stage">
  <div id="zzz"><span class="z">Z</span><span class="z">z</span><span class="z">z</span></div>
  <div id="stars"><span>✦</span><span>✧</span><span>✦</span></div>
  <div id="q">?</div>
  <div id="rig"><div id="swing"><div id="face"><div id="trick"><div id="bot">
    <svg viewBox="0 0 64 80">
      <defs>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b4f"/><stop offset=".5" stop-color="#b3121f"/><stop offset="1" stop-color="#5e0710"/></linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".55" stop-color="#e3a623"/><stop offset="1" stop-color="#8a5a0c"/></linearGradient>
        <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#9ffbff"/><stop offset=".7" stop-color="#3ff0ff" stop-opacity=".6"/><stop offset="1" stop-color="#3ff0ff" stop-opacity="0"/></linearGradient>
        <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bffcff" stop-opacity=".8"/><stop offset="1" stop-color="#3ff0ff" stop-opacity="0"/></linearGradient>
      </defs>
      <ellipse cx="32" cy="79" rx="13" ry="1.8" fill="#3ff0ff" opacity=".25"/>
      <g id="m0">
        <!-- ноги -->
        <g id="legL" class="limb">
          <rect x="22.5" y="54" width="7" height="13" rx="2.5" fill="url(#red)" stroke="#ff8a96" stroke-opacity=".35" stroke-width=".5"/>
          <path class="boot" d="M21.5 66 h9 l1 9 q-5.5 2 -11 0 z" fill="url(#gold)" stroke="#5e0710" stroke-width=".5"/>
          <path class="flame" d="M22.5 76 q3.5 14 7 0 z"/>
        </g>
        <g id="legR" class="limb">
          <rect x="34.5" y="54" width="7" height="13" rx="2.5" fill="url(#red)" stroke="#ff8a96" stroke-opacity=".35" stroke-width=".5"/>
          <path class="boot" d="M33.5 66 h9 l1 9 q-5.5 2 -11 0 z" fill="url(#gold)" stroke="#5e0710" stroke-width=".5"/>
          <path class="flame" d="M34.5 76 q3.5 14 7 0 z"/>
        </g>
        <!-- руки -->
        <g id="armL" class="limb">
          <rect x="11.5" y="32" width="7.5" height="12" rx="3" fill="url(#red)"/>
          <rect x="11" y="43" width="8.5" height="9" rx="2.5" fill="url(#gold)"/>
          <circle cx="15.2" cy="52.6" r="2" fill="#bffcff" filter="url(#glow)" opacity=".85"/>
          <path class="pflame" d="M13.2 53.5 q2 9 4 0 z"/>
        </g>
        <g id="armR" class="limb">
          <rect x="45" y="32" width="7.5" height="12" rx="3" fill="url(#red)"/>
          <rect x="44.5" y="43" width="8.5" height="9" rx="2.5" fill="url(#gold)"/>
          <circle cx="48.8" cy="52.6" r="2" fill="#bffcff" filter="url(#glow)" opacity=".85"/>
          <path class="pflame" d="M46.8 53.5 q2 9 4 0 z"/>
        </g>
        <!-- корпус -->
        <path d="M18 31 Q32 26 46 31 L44 50 Q32 57 20 50 Z" fill="url(#red)" stroke="#ff8a96" stroke-opacity=".4" stroke-width=".6"/>
        <path d="M26 47 L38 47 L36 53 Q32 55 28 53 Z" fill="url(#gold)" opacity=".9"/>
        <path d="M21 34 L27 33 M43 34 L37 33" stroke="#f2b632" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
        <circle cx="32" cy="41" r="5.6" fill="#061219" stroke="#9ffbff" stroke-opacity=".7" stroke-width=".8"/>
        <g id="reactorRing"><circle cx="32" cy="41" r="4.1" fill="none" stroke="#3ff0ff" stroke-width="1.1" stroke-dasharray="2 1.4"/></g>
        <circle id="reactorCore" cx="32" cy="41" r="2.3"/>
        <!-- голова -->
        <g id="head">
          <path d="M19 16 Q19 3 32 3 Q45 3 45 16 L44 26 Q41 31 32 31 Q23 31 20 26 Z" fill="url(#red)" stroke="#ff8a96" stroke-opacity=".45" stroke-width=".6"/>
          <path d="M23 11 Q32 8 41 11 L41.5 23 Q39 28.5 32 29 Q25 28.5 22.5 23 Z" fill="url(#gold)"/>
          <path d="M24 6.5 Q32 3.5 40 6.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2" stroke-linecap="round"/>
          <circle class="ear" cx="19.6" cy="18" r="1.4"/><circle class="ear" cx="44.4" cy="18" r="1.4"/>
          <path id="beam" d="M28 17 L36 17 L58 78 L6 78 Z"/>
          <g id="eyes">
            <path class="eye l" d="M24.6 15.4 L30.4 16.6 L30 18.9 L25 18 Z"/>
            <path class="eye r" d="M39.4 15.4 L33.6 16.6 L34 18.9 L39 18 Z"/>
            <path class="happyeyes" d="M25 18 Q27.5 14.5 30 18 M34 18 Q36.5 14.5 39 18"/>
          </g>
          <circle class="blush" cx="25" cy="22" r="1.6"/><circle class="blush" cx="39" cy="22" r="1.6"/>
          <g id="mouth"><rect class="mouth" x="29" y="23.5" width="1.4" height="2.4" rx=".6"/><rect class="mouth" x="31.3" y="23" width="1.4" height="3.2" rx=".6"/><rect class="mouth" x="33.6" y="23.5" width="1.4" height="2.4" rx=".6"/></g>
          <path d="M27 24.8 L37 24.8" stroke="#8a5a0c" stroke-width=".7" opacity=".7"/>
        </g>
      </g>
    </svg>
  </div></div></div></div></div>

  <div id="bubble"><b>МАРК-0</b><span id="btext"></span></div>

  <div id="menu">
    <svg class="cloud" viewBox="0 0 318 250" preserveAspectRatio="none"><path class="cpath" d="M70 40 C78 14 118 6 140 24 C156 4 196 4 210 26 C232 10 270 18 274 46 C304 52 312 88 292 106 C312 126 304 166 274 172 C276 206 238 224 212 210 C196 236 150 238 134 214 C110 234 66 222 64 192 C30 196 10 162 26 136 C2 118 8 76 38 70 C34 52 50 38 70 40 Z"/></svg>
    <div class="hdr">ПРОТОКОЛЫ · МАРК-0</div>
    <div class="items" id="items"></div>
    <div class="mk">
      <button data-pet="flip">трюк</button><button data-pet="fly">полёт</button><button data-pet="wall">на стену</button><button data-pet="sleep">спать</button>
    </div>
  </div>
  <div class="tail" id="tail1"></div><div class="tail" id="tail2" style="width:7px;height:7px"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pet;
const send = m => native && native.postMessage(m);
const params = new URLSearchParams(location.search);
let voice = params.get('voice') !== '0';
const root = document.body;
const CX = 330, CY = 330;           // центр робота в окне
let pose = { o: 'floor', a: 'idle', f: 1, vis: [0, 0, 660, 660] };

/* ── поза от нативного окна ── */
const ACTS = ['idle', 'walk', 'fly', 'fall', 'drag', 'sit', 'sleep', 'dizzy', 'peek', 'chase'];
const ORIENTS = ['floor', 'wallL', 'wallR', 'ceil', 'air'];
const ACT_LINES = { fly: ['fly', .25], sit: ['window_sit', .35], peek: ['peek', .6], chase: ['chase', .5], dizzy: ['landed_dizzy', .9],
  drag: ['grab', .9], fall: ['fall', .35], sleep: ['sleep', .5] };
let lastActLine = 0;
window.petPose = p => {
  const prev = pose;
  pose = Object.assign({}, pose, p);
  ORIENTS.forEach(o => root.classList.toggle('o-' + o, pose.o === o));
  ACTS.forEach(a => root.classList.toggle('a-' + a, pose.a === a));
  root.classList.toggle('f-l', pose.f < 0); root.classList.toggle('f-r', pose.f >= 0);
  root.classList.toggle('mag', pose.o === 'wallL' || pose.o === 'wallR' || pose.o === 'ceil');
  root.classList.toggle('thr', !!pose.thr);
  if (pose.a !== prev.a) {
    if (pose.a !== 'drag') $('swing').style.transform = '';
    onAct(pose.a, prev.a);
  }
  if (pose.o !== prev.o && (pose.o === 'wallL' || pose.o === 'wallR') && prev.o === 'floor') actLine('climb_wall', .45);
  if (pose.o === 'ceil' && prev.o !== 'ceil') actLine('ceiling', .6);
  placeBubble(); placeMenu(); reportHit();
};
window.petSwing = deg => { $('swing').style.transform = `rotate(${deg.toFixed(1)}deg)`; };
function onAct(a, prev) {
  if (a === 'sleep') sfx('sleepy');
  if (prev === 'sleep' && a !== 'sleep') { sfx('happy'); }
  if (a === 'drag') { sfx('grab'); closeMenu(); }
  if (a === 'fall' && prev === 'drag') { sfx('whee'); actLine('thrown', .6); return; }
  if (a === 'dizzy') { sfx('thud'); }
  if (prev === 'fall' && a !== 'dizzy') { sfx('land'); if (Math.random() < .3) actLine('land', 1); }
  if (prev === 'fly' && a !== 'fly') { if (Math.random() < .2) actLine('land', 1); }
  if (a === 'fly' || a === 'chase') sfx('jet');
  const l = ACT_LINES[a];
  if (l) actLine(l[0], l[1], a === 'sit' && pose.app ? { app: pose.app } : null);
}
function actLine(cat, prob, extra) {
  if (Math.random() > prob) return;
  if (Date.now() - lastActLine < 9000 && cat !== 'grab' && cat !== 'landed_dizzy') return;
  lastActLine = Date.now();
  sayCat(cat, false, extra);
}

/* ── пузырь ── */
let bubbleTimer = null, audioNow = null;
function placeBubble() {
  const b = $('bubble'); if (!b.classList.contains('show')) return;
  const w = b.offsetWidth, h = b.offsetHeight;
  let x, y;
  const o = pose.a === 'sit' || pose.a === 'sleep' ? 'floor' : pose.o;
  if (o === 'ceil') { x = CX - w / 2; y = CY + 52; }
  else if (o === 'wallL') { x = CX + 52; y = CY - h / 2; }
  else if (o === 'wallR') { x = CX - 52 - w; y = CY - h / 2; }
  else { x = CX - w / 2; y = CY - 56 - h; }
  [x, y] = clampBox(x, y, w, h);
  b.style.left = x + 'px'; b.style.top = y + 'px';
}
function clampBox(x, y, w, h) {
  const v = pose.vis || [0, 0, 660, 660];
  const x0 = Math.max(4, v[0] + 6), y0 = Math.max(4, v[1] + 6), x1 = Math.min(656, v[2] - 6), y1 = Math.min(656, v[3] - 6);
  x = Math.max(x0, Math.min(x, x1 - w)); y = Math.max(y0, Math.min(y, y1 - h));
  return [x, y];
}
function showBubble(text, opts = {}, ms) {
  const b = $('bubble');
  $('btext').textContent = text;
  b.classList.toggle('alert', opts.level === 'warn');
  root.classList.toggle('alert', opts.level === 'warn');
  b.classList.add('show'); root.classList.add('talk');
  placeBubble();
  clearTimeout(bubbleTimer);
  ms = ms || Math.min(13000, 3200 + text.length * 55);
  bubbleTimer = setTimeout(() => { b.classList.remove('show'); root.classList.remove('talk', 'alert'); }, ms);
  if (opts.mood) emote(opts.mood);
}
function say(text, opts = {}) {
  if (!text) return;
  if (voice && opts.speak) {
    if (audioNow) { try { audioNow.pause(); } catch (e) {} }
    const a = new Audio('/api/tts_audio?kind=pet&text=' + encodeURIComponent(text));
    audioNow = a; a.volume = .9;
    let shown = false;
    const go = ms => { if (shown) return; shown = true; showBubble(text, opts, ms); };
    a.addEventListener('playing', () => { send({ cmd: 'speaking', on: true }); go(isFinite(a.duration) && a.duration > 0 ? a.duration * 1000 + 1600 : 0); });
    a.addEventListener('ended', () => send({ cmd: 'speaking', on: false }));
    a.addEventListener('pause', () => send({ cmd: 'speaking', on: false }));
    a.addEventListener('error', () => go());
    setTimeout(() => go(), 5000);
    a.play().catch(() => go());
  } else {
    showBubble(text, opts);
    if (opts.mood) sfx(opts.mood);
  }
}
async function sayCat(cat, speak, extra) {
  try {
    const q = new URLSearchParams({ cat, speak: speak ? '1' : '0', ...(extra || {}) });
    const t = await (await fetch('/api/pet/say?' + q, { cache: 'no-store' })).json();
    if (t.text) say(t.text, { speak: t.speak, mood: t.mood });
  } catch (e) {}
}
window.petBubble = text => { if (pose.a === 'sleep') return; showBubble(text, { mood: 'happy' }); };
window.petListen = on => { root.classList.toggle('listen', !!on); if (on) sfx('listen'); };
window.petVoice = on => { voice = !!on; };
window.petLevel = v => { $('reactorCore').style.opacity = (.55 + v * .45).toFixed(2); };

/* ── эмоции ── */
const MOODS = ['happy', 'sad', 'confused', 'scan', 'wave', 'stroke'];
let moodT = null;
function emote(m, ms) {
  if (m === 'love' || m === 'excited' || m === 'happy' || m === 'playful') flash('happy', 600);
  if (m === 'love') hearts(3);
  if (m === 'sad' || m === 'care') flash('sad', 2500);
  if (m === 'curious') flash('look', 1500);
  if (m === 'dizzy') {}
}
function flash(cls, ms) {
  root.classList.add(cls);
  clearTimeout(flash['t' + cls]); flash['t' + cls] = setTimeout(() => root.classList.remove(cls), ms);
}
function hearts(n, sym) {
  for (let i = 0; i < n; i++) setTimeout(() => {
    const h = document.createElement('div'); h.className = 'fx'; h.textContent = sym || '♥';
    h.style.color = sym ? '#ffd166' : '#ff6fa5'; h.style.textShadow = '0 0 6px currentColor';
    h.style.left = (CX - 6 + (Math.random() - .5) * 26) + 'px'; h.style.top = (CY - 50) + 'px';
    h.style.setProperty('--dx', ((Math.random() - .5) * 30) + 'px');
    $('stage').appendChild(h); setTimeout(() => h.remove(), 1500);
  }, i * 260);
}

/* ── звуки (синтез, тихо) ── */
let actx = null;
function ac() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
function note(f1, f2, dur, delay, vol, type) {
  try {
    const c = ac(), t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || .05, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
function hiss(dur, vol, f) {
  try {
    const c = ac(), n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
    const s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    bp.type = 'bandpass'; bp.frequency.value = f || 1800; g.gain.value = vol || .04;
    s.buffer = buf; s.connect(bp).connect(g).connect(c.destination); s.start();
  } catch (e) {}
}
const SFX = {
  happy: () => { note(880, 1320, .09); note(1320, 1760, .09, .1); },
  excited: () => { note(990, 1480, .07); note(1180, 1760, .07, .08); note(1480, 2200, .09, .16); },
  playful: () => { note(700, 1400, .12, 0, .05, 'triangle'); note(1400, 900, .12, .13, .05, 'triangle'); },
  love: () => { note(660, 660, .16, 0, .04); note(880, 880, .22, .18, .04); },
  sad: () => { note(660, 330, .35, 0, .05, 'triangle'); },
  curious: () => { note(500, 900, .14); note(900, 1500, .16, .16); },
  sleepy: () => { note(400, 260, .5, 0, .035); },
  care: () => { note(740, 880, .2, 0, .035); },
  smart: () => { note(1500, 1500, .04); note(2000, 2000, .04, .06); note(2500, 2500, .05, .12); },
  alert: () => { note(880, 660, .14, 0, .06, 'square'); note(880, 660, .14, .2, .06, 'square'); },
  listen: () => { note(900, 1800, .1, 0, .05); },
  calm: () => { note(1100, 1300, .08, 0, .03); },
  grab: () => { note(600, 1500, .18, 0, .05, 'triangle'); },
  whee: () => { note(1600, 500, .5, 0, .05, 'triangle'); },
  thud: () => { note(140, 60, .2, 0, .09); hiss(.12, .05, 400); note(1800, 1200, .1, .2, .03); note(1800, 1200, .1, .32, .03); },
  land: () => { note(200, 90, .12, 0, .06); },
  jet: () => { hiss(.6, .05, 2400); },
  menu: () => { note(500, 1500, .14, 0, .045); note(1500, 2000, .1, .12, .03); },
  pick: () => { note(1800, 1200, .06, 0, .035); },
  dizzy: () => { note(900, 1200, .1); note(1200, 900, .1, .1); note(900, 1200, .1, .2); },
};
function sfx(m) { if (!voice) return; try { (SFX[m] || SFX.calm)(); } catch (e) {} }

/* мурчание при поглаживании */
let purr = null;
function purrOn(on) {
  if (!voice) return;
  try {
    if (on && !purr) {
      const c = ac(), o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain(), f = c.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = 52; lfo.frequency.value = 24; lg.gain.value = .03;
      f.type = 'lowpass'; f.frequency.value = 380; g.gain.value = .0001;
      lfo.connect(lg).connect(g.gain); o.connect(f).connect(g).connect(c.destination);
      g.gain.exponentialRampToValueAtTime(.035, c.currentTime + .2);
      o.start(); lfo.start(); purr = { o, lfo, g, c };
    } else if (!on && purr) {
      const p = purr; purr = null;
      p.g.gain.cancelScheduledValues(p.c.currentTime);
      p.g.gain.setValueAtTime(.03, p.c.currentTime); p.g.gain.exponentialRampToValueAtTime(.0001, p.c.currentTime + .3);
      setTimeout(() => { try { p.o.stop(); p.lfo.stop(); } catch (e) {} }, 400);
    }
  } catch (e) {}
}

/* ── глаза следят за курсором ── */
window.petMouse = (dx, dy) => {
  if (pose.a === 'sleep') return;
  const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 360);
  let ex = (dx / d) * 1.6 * k, ey = (-dy / d) * 1.2 * k;
  // в повёрнутой позе переводим направление взгляда в систему робота
  const o = pose.o;
  if (o === 'wallL') [ex, ey] = [ey, -ex]; else if (o === 'wallR') [ex, ey] = [-ey, ex]; else if (o === 'ceil') [ex, ey] = [-ex, -ey];
  if (pose.f < 0) ex = -ex;
  $('eyes').style.transform = `translate(${ex.toFixed(2)}px,${ey.toFixed(2)}px)`;
};

/* ── поглаживание: нативное окно присылает «энергию» движения курсора над Марком ── */
let strokeE = 0, strokeAcc = 0, strokeLine = 0, strokeT = null;
window.petStroke = v => {
  if (pose.a === 'drag' || pose.a === 'fall') return;
  strokeE = Math.min(1.5, strokeE + v);
  if (strokeE > .35) {
    if (!root.classList.contains('stroke')) { root.classList.add('stroke'); purrOn(true); if (pose.a === 'sleep') send({ cmd: 'do', what: 'wake' }); }
    strokeAcc += v;
    if (Math.random() < .08) hearts(1);
    const now = Date.now();
    if (now - strokeLine > 5200 && strokeAcc > .9) {
      strokeLine = now;
      sayCat(strokeAcc > 9 ? 'stroke_long' : 'stroke', Math.random() < .3);
    }
  }
  clearTimeout(strokeT);
  strokeT = setTimeout(() => { root.classList.remove('stroke'); purrOn(false); strokeE = 0; if (strokeAcc > 6) hearts(3); strokeAcc = 0; }, 650);
};
setInterval(() => { strokeE *= .7; }, 120);

/* ── клики: один — фраза, два — облако функций, три — трюк ── */
let clickT = null;
$('bot').addEventListener('mousedown', e => { if (e.button === 0) send({ cmd: 'press' }); });
$('bot').addEventListener('click', e => {
  if (pose.a === 'drag' || window._dragged) { window._dragged = false; return; }
  clearTimeout(clickT);
  if (e.detail === 2) { openMenu(); return; }
  if (e.detail >= 3) { closeMenu(); trick(); return; }
  clickT = setTimeout(() => {
    if (pose.a === 'sleep') send({ cmd: 'do', what: 'wake' });
    flash('happy', 600);
    fetch('/api/pet/poke', { cache: 'no-store' }).then(r => r.json())
      .then(t => say(t.text, { speak: t.speak && Math.random() < .5, mood: t.mood || 'playful' }))
      .catch(() => say('Марк-0 на связи!', {}));
  }, 300);
});
window.petDragged = () => { window._dragged = true; };

/* ── облако функций ── */
const IC = {
  power: '<path d="M12 3v8"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/>',
  restart: '<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  dash: '<rect x="3" y="4" width="18" height="14" rx="1"/><path d="M7 14l3-4 3 3 4-5"/>',
  widget: '<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',
  report: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
  scan: '<path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4M4 12h16"/>',
  shot: '<rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 7l2-3h4l2 3"/>',
  vpn: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  quiet: '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/>',
  joke: '<circle cx="12" cy="12" r="8"/><path d="M8.5 14a4 4 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/>',
};
const ITEMS = [
  ['shutdown', 'Выключить', 'power', 'red'], ['restart', 'Перезапуск', 'restart'], ['sleep_mac', 'Сон', 'moon'], ['lock', 'Замок', 'lock'],
  ['dashboard', 'Дашборд', 'dash'], ['widget', 'Виджет', 'widget'], ['status', 'Доклад', 'report'], ['scan', 'Скан', 'scan'],
  ['screenshot', 'Скриншот', 'shot'], ['vpn', 'VPN', 'vpn'], ['quiet', 'Тишина', 'quiet'], ['joke', 'Шутка', 'joke'],
];
$('items').innerHTML = ITEMS.map(([a, n, ic, cls], i) => `<button data-a="${a}" class="${cls || ''}" style="animation-delay:${i * 28}ms"><i><svg viewBox="0 0 24 24">${IC[ic]}</svg></i>${n}</button>`).join('');
let menuOpen = false, menuT = null;
function openMenu() {
  menuOpen = true; sfx('menu'); placeMenu();
  const m = $('menu'); m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
  $('tail1').style.display = $('tail2').style.display = 'block';
  send({ cmd: 'menu', open: true });
  if (Math.random() < .5) sayCat('menu_open', false);
  clearTimeout(menuT); menuT = setTimeout(closeMenu, 15000);
  setTimeout(reportHit, 60);
}
function closeMenu() {
  if (!menuOpen) return;
  menuOpen = false; $('menu').classList.remove('show');
  $('tail1').style.display = $('tail2').style.display = 'none';
  send({ cmd: 'menu', open: false });
  setTimeout(reportHit, 300);
}
function placeMenu() {
  if (!menuOpen) { $('tail1').style.display = $('tail2').style.display = 'none'; return; }
  const m = $('menu'), w = 344, h = 276, v = pose.vis || [0, 0, 660, 660];
  const spaceAbove = CY - 60 - Math.max(0, v[1]), below = (pose.o === 'ceil') || spaceAbove < h * .8;
  let x = CX - w / 2, y = below ? CY + 52 : CY - 52 - h;
  [x, y] = clampBox(x, y, w, h);
  m.style.left = x + 'px'; m.style.top = y + 'px';
  m.style.transformOrigin = below ? '50% 0' : '50% 100%';
  const t1 = $('tail1'), t2 = $('tail2');
  t1.style.left = (CX - 2) + 'px'; t2.style.left = (CX + 1) + 'px';
  t1.style.top = (below ? CY + 44 : CY - 58) + 'px'; t2.style.top = (below ? CY + 38 : CY - 48) + 'px';
}
$('menu').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  sfx('pick');
  if (b.dataset.pet) { closeMenu(); send({ cmd: 'do', what: b.dataset.pet }); if (b.dataset.pet === 'flip') trick('flip'); return; }
  closeMenu();
  send({ cmd: 'action', name: b.dataset.a });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
window.petMenuClose = closeMenu;

/* ── области, где Марк ловит мышь ── */
function reportHit() {
  const r = $('bot').getBoundingClientRect(), rects = [[r.left - 4, r.top - 4, r.width + 8, r.height + 8]];
  if (menuOpen) { const m = $('menu').getBoundingClientRect(); rects.push([m.left, m.top, m.width, m.height]); }
  send({ cmd: 'hit', rects });
}
setInterval(reportHit, 700);

/* ── трюки и команды ── */
const TRICKS = ['flip', 'salute', 'dance', 'spin'];
let trickBusy = false;
function trick(name) {
  if (trickBusy || pose.a === 'drag' || pose.a === 'fall') return;
  name = TRICKS.includes(name) ? name : TRICKS[Math.floor(Math.random() * TRICKS.length)];
  trickBusy = true;
  root.classList.add('t-' + name);
  sfx(name === 'dance' ? 'playful' : name === 'flip' ? 'excited' : 'happy');
  if (name !== 'spin') hearts(2, '✦');
  const ms = name === 'dance' ? 3100 : 1450;
  send({ cmd: 'busy', ms });
  setTimeout(() => { root.classList.remove('t-' + name); trickBusy = false; }, ms);
}
window.petCmd = c => {
  if (TRICKS.includes(c)) return trick(c);
  if (c === 'scan') { flash('scan', 3600); sfx('smart'); actLine('scan', 1); return; }
  if (c === 'wave') { flash('wave', 2300); sfx('happy'); return; }
  if (c === 'happy') { flash('happy', 700); hearts(2); sfx('happy'); return; }
  if (c === 'sad') { flash('sad', 3000); sfx('sad'); return; }
  if (c === 'confused') { flash('confused', 2600); sfx('curious'); return; }
  if (c === 'menu') { openMenu(); return; }
};

/* ── советы и новости от ядра ── */
async function tip() {
  try {
    const t = await (await fetch('/api/pet/tip', { cache: 'no-store' })).json();
    if (t.text && !(pose.a === 'sleep' && t.level !== 'warn')) say(t.text, { level: t.level, speak: t.speak, mood: t.mood });
  } catch (e) {}
  setTimeout(tip, (150 + Math.random() * 180) * 1000);
}
setInterval(async () => {
  try {
    const n = await (await fetch('/api/pet/news', { cache: 'no-store' })).json();
    if (!n || (!n.text && !n.trick)) return;
    if (n.text) { flash('happy', 800); say(n.text, { speak: false, mood: n.mood || 'happy' }); }
    if (n.trick) setTimeout(() => trick(n.trick), n.text ? 500 : 0);
  } catch (e) {}
}, 3000);

/* ── иногда оглядывается ── */
setInterval(() => {
  if (pose.a !== 'idle' && pose.a !== 'sit') return;
  const r = Math.random();
  if (r < .25) flash('look', 1400); else if (r < .45) flash('look2', 1200);
  else if (r < .5) { flash('scan', 2400); }
}, 4200);

/* ── старт ── */
setTimeout(() => { flash('wave', 2300); say('Марк-0 на связи. Пойду осмотрюсь!', { speak: true, mood: 'happy' }); }, 1500);
setTimeout(tip, 60000);
reportHit();
</script>
